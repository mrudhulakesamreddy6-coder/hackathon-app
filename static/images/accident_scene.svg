<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Sky & Highway Background -->
  <rect width="800" height="240" fill="#1e293b"/>
  <rect x="0" y="220" width="800" height="40" fill="#065f46" opacity="0.4"/>

  <!-- Highway Road Surface -->
  <rect x="0" y="250" width="800" height="250" fill="url(#roadGrad)"/>
  
  <!-- Dashed Highway Centerline -->
  <line x1="50" y1="360" x2="150" y2="360" stroke="#facc15" stroke-width="6"/>
  <line x1="250" y1="360" x2="350" y2="360" stroke="#facc15" stroke-width="6"/>
  <line x1="450" y1="360" x2="550" y2="360" stroke="#facc15" stroke-width="6"/>
  <line x1="650" y1="360" x2="750" y2="360" stroke="#facc15" stroke-width="6"/>

  <!-- Overturned Transport Truck -->
  <g transform="translate(180, 220) rotate(-22)">
    <rect x="0" y="0" width="220" height="90" fill="#dc2626" rx="6" stroke="#991b1b" stroke-width="2"/>
    <rect x="160" y="10" width="50" height="40" fill="#93c5fd" opacity="0.7"/>
    <circle cx="50" cy="95" r="22" fill="#0f172a" stroke="#475569" stroke-width="6"/>
    <circle cx="120" cy="95" r="22" fill="#0f172a" stroke="#475569" stroke-width="6"/>
    <circle cx="180" cy="95" r="22" fill="#0f172a" stroke="#475569" stroke-width="6"/>
  </g>

  <!-- Damaged Passenger Bus -->
  <rect x="420" y="270" width="260" height="95" fill="#2563eb" rx="8" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="440" y="285" width="40" height="30" fill="#93c5fd" opacity="0.8"/>
  <rect x="495" y="285" width="40" height="30" fill="#93c5fd" opacity="0.8"/>
  <rect x="550" y="285" width="40" height="30" fill="#93c5fd" opacity="0.8"/>
  <rect x="605" y="285" width="55" height="30" fill="#93c5fd" opacity="0.8"/>
  <!-- Front bumper crumpled -->
  <polygon points="420,270 405,310 420,365" fill="#1e40af"/>
  <circle cx="470" cy="370" r="22" fill="#0f172a" stroke="#475569" stroke-width="6"/>
  <circle cx="630" cy="370" r="22" fill="#0f172a" stroke="#475569" stroke-width="6"/>

  <!-- Traffic Cones -->
  <polygon points="120,380 130,350 140,380" fill="#f97316"/>
  <rect x="116" y="380" width="28" height="4" fill="#000"/>
  <polygon points="340,390 350,360 360,390" fill="#f97316"/>
  <rect x="336" y="390" width="28" height="4" fill="#000"/>

  <!-- Flashing Blue/Red Emergency Light Reflections -->
  <circle cx="680" cy="230" r="40" fill="#3b82f6" opacity="0.3"/>
  <circle cx="720" cy="230" r="40" fill="#ef4444" opacity="0.3"/>

  <!-- LIVE GEOTAG WATERMARK OVERLAY -->
  <rect x="20" y="405" width="760" height="75" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#c084fc" stroke-width="1.5"/>
  <circle cx="50" cy="442" r="14" fill="#8b5cf6"/>
  <text x="50" y="447" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">CAD</text>
  
  <text x="80" y="432" fill="#c084fc" font-family="monospace" font-size="15" font-weight="bold">📍 GEOTAG: 15.9250° N, 80.4520° E &bull; ACCURACY: &plusmn;4m</text>
  <text x="80" y="452" fill="#f1f5f9" font-family="sans-serif" font-size="12">LOCATION: North Bypass Highway KM 14, Near Toll Plaza, Bapatla</text>
  <text x="80" y="468" fill="#94a3b8" font-family="sans-serif" font-size="11">TIMESTAMP: 2026-11-06 16:10:06 IST &bull; HIGH-IMPACT VEHICULAR RESCUE IN PROGRESS</text>
</svg>

